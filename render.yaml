services:
  - type: web
    name: task-manager-backend
    env: docker
    dockerfilePath: ./server/Dockerfile
    envVars:
      - key: MONGODB_URI
        fromDatabase:
          name: taskmanager-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 5000

  - type: web
    name: task-manager-frontend
    env: docker
    dockerfilePath: ./client/Dockerfile
    envVars:
      - key: VITE_API_URL
        value: https://task-manager-backend.onrender.com/api

databases:
  - name: taskmanager-db
    plan: free
